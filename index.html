<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake and Ladder Game</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>🐍 Snake and Ladder Game 🪜</h1>
            <div class="game-controls">
                <button id="newGameBtn" class="btn btn-primary">New Game</button>
                <button id="resetBtn" class="btn btn-secondary">Reset</button>
                <button id="saveBtn" class="btn btn-secondary">Save Game</button>
                <button id="loadBtn" class="btn btn-secondary">Load Game</button>
            </div>
        </header>

        <div class="game-setup" id="gameSetup">
            <div class="setup-card">
                <h2>Game Setup</h2>
                <div class="player-setup">
                    <label for="playerCount">Number of Players:</label>
                    <select id="playerCount">
                        <option value="2">2 Players</option>
                        <option value="3">3 Players</option>
                        <option value="4">4 Players</option>
                        <option value="1">1 Player</option>
                    </select>
                </div>
                <div class="player-names" id="playerNames">
                    <!-- Player name inputs will be generated here -->
                </div>
                <button id="startGameBtn" class="btn btn-primary btn-large">Start Game</button>
            </div>
        </div>

        <div class="game-board-container" id="gameBoardContainer" style="display: none;">
            <div class="game-info">
                <div class="current-player">
                    <h3>Current Player: <span id="currentPlayerName">Player 1</span></h3>
                    <div class="player-color" id="currentPlayerColor"></div>
                </div>
                
                <div class="dice-container">
                    <div class="dice" id="dice">
                        <div class="dice-face" id="diceFace">🎲</div>
                    </div>
                    <button id="rollDiceBtn" class="btn btn-primary">Roll Dice</button>
                    <div class="dice-result" id="diceResult"></div>
                </div>

                <div class="player-positions">
                    <h4>Player Positions:</h4>
                    <div id="playerList"></div>
                </div>
            </div>

            <div class="game-board" id="gameBoard">
                <!-- Game board squares will be generated here -->
            </div>

            <div class="game-messages" id="gameMessages">
                <div class="message" id="gameMessage">Welcome to Snake and Ladder! Roll the dice to start.</div>
            </div>
        </div>

        <!-- Win Modal -->
        <div class="modal" id="winModal">
            <div class="modal-content">
                <div class="win-celebration">
                    <h2>🎉 Congratulations! 🎉</h2>
                    <p id="winnerMessage">Player 1 Wins!</p>
                    <div class="celebration-animation">
                        <div class="confetti"></div>
                        <div class="confetti"></div>
                        <div class="confetti"></div>
                        <div class="confetti"></div>
                        <div class="confetti"></div>
                    </div>
                    <button id="playAgainBtn" class="btn btn-primary btn-large">Play Again</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
